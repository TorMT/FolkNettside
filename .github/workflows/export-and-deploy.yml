name: export-and-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folknettside-pages-publish
  cancel-in-progress: true

jobs:
  export-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Export public site
        env:
          PAGES_BASE_PATH: /FolkNettside
        run: python scripts/export_repo.py

      - name: Deploy export to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export
          publish_branch: gh-pages

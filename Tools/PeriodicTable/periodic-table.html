<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Periodisk Tabell – Interaktiv</title>
<link rel="stylesheet" href="/assets/css/sidebar-flyout-fix.css">
<link rel="stylesheet" href="/assets/css/sidebar-loader-theme-override.css">
<link rel="stylesheet" href="/assets/css/navbar-theme-fix.css">

<style>
  :root{
    --primary: #004f9f;
    --primary-contrast: #ffffff;
    --bg-main: #ffffff;
    --bg-card: #f8f9fa;
    --bg-alt: #eef2f7;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --danger: #ef4444;
    --success: #10b981;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow: 0 10px 20px -14px rgba(0,0,0,.35);
    --shadow-soft: 0 4px 14px -12px rgba(0,0,0,.25);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg-main); color:var(--text-main); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .container{ max-width: 1840px; margin:0 auto; padding:12px; }

  .workspace{ display:grid; grid-template-columns: 350px 1fr; gap:12px; align-items:start; }

  .leftRail, .rightRailCard{
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
  }

  .leftRail{ position: sticky; top: 8px; padding:12px; max-height: calc(100vh - 20px); overflow:auto; }
  .title{ font-size:1.3rem; font-weight:900; margin-bottom:4px; }
  .subtitle{ color:var(--text-muted); font-size:.86rem; font-weight:700; margin-bottom:12px; }

  .tempControl{ background:var(--bg-main); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:10px; margin-bottom:10px; }
  .tempControl label{ font-size:.8rem; font-weight:900; color:var(--text-muted); display:flex; justify-content:space-between; }
  .tempValue{ color:var(--primary); }
  .tempControl input{ width:100%; margin-top:8px; }

  .searchPanel{ display:grid; gap:8px; margin-bottom:10px; }
  .searchPanel input, .searchPanel select, .searchPanel button{
    width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--border-color);
    background:var(--bg-main); color:var(--text-main); font-weight:700;
  }
  .searchPanel button{ background:var(--primary); color:var(--primary-contrast); border-color:var(--primary); cursor:pointer; }
  .searchPanel button.secondary{ background:var(--bg-alt); color:var(--text-main); border-color:var(--border-color); }
  .filterCount{ color:var(--text-muted); font-weight:900; font-size:.84rem; }
  .quickFilters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .quickBtn{
    font-size:.7rem; padding:6px 8px; border-radius:999px; border:1px solid var(--border-color);
    background:var(--bg-main); color:var(--text-main); font-weight:800; cursor:pointer;
  }
  .quickBtn.active{ background:var(--primary); color:var(--primary-contrast); border-color:var(--primary); }

  .propertyTabs{ display:flex; gap:6px; padding:7px; overflow:auto; border-bottom:1px solid var(--border-color); }
  .propertyTab{ padding:7px 10px; border:none; border-radius:10px; background:transparent; font-size:.76rem; font-weight:900; white-space:nowrap; cursor:pointer; }
  .propertyTab.active{ background:var(--primary); color:var(--primary-contrast); }

  .rightRailCard{ padding:10px; }
  .tableContainer{ background:var(--bg-main); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:10px; }
  .periodicTable{ display:grid; grid-template-columns: repeat(18, minmax(46px, 1fr)); gap:4px; }
  .separateRows{ display:grid; grid-template-columns: repeat(15, minmax(46px, 1fr)); gap:4px; margin-top:10px; }

  .element{ min-height:66px; border:2px solid var(--border-color); border-radius:10px; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; cursor:pointer; transition:.18s; }
  .element:hover{ transform:translateY(-1px); border-color:var(--primary); }
  .element.selected{ border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
  .element.filteredOut{ opacity:.18; filter:grayscale(.5); }
  .number{ font-size:.58rem; color:var(--text-muted); position:absolute; top:2px; left:4px; font-weight:800; }
  .symbol{ font-size:1.2rem; font-weight:900; line-height:1; }
  .name{ font-size:.56rem; color:var(--text-muted); margin-top:2px; font-weight:700; text-align:center; }
  .property{ font-size:.62rem; margin-top:2px; font-weight:900; }
  .crystalBadge{ font-size:.5rem; margin-top:2px; border:1px solid var(--border-color); border-radius:14px; padding:1px 4px; background:rgba(255,255,255,.75); font-weight:900; }

  .stateIndicator{ position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; }
  .state-solid{ background:var(--text-main); }
  .state-liquid{ background:var(--primary); }
  .state-gas{ background:var(--success); }
  .state-unknown{ background:var(--text-muted); }

  .empty,.spacer{ background:transparent; border:none; pointer-events:none; }
  .spacer{ display:flex; align-items:center; justify-content:center; font-size:.72rem; color:var(--text-muted); font-weight:800; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .legendItem{ display:flex; align-items:center; gap:6px; font-size:.76rem; font-weight:800; }
  .legendColor{ width:14px; height:14px; border-radius:4px; border:1px solid var(--border-color); }

  .infoPanel{ margin-top:10px; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-main); padding:10px; }
  .infoMain .symbol{ font-size:2.6rem; }
  .infoMain .name{ color:var(--text-main); font-size:1.2rem; font-weight:900; }
  .infoMain .meta{ color:var(--text-muted); font-size:.9rem; margin-top:2px; }
  .infoGrid{ display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px; }
  .infoProp{ border:1px solid var(--border-color); border-radius:10px; padding:8px; }
  .infoProp .label{ font-size:.75rem; color:var(--text-muted); font-weight:800; }
  .infoProp .value{ font-size:.95rem; font-weight:900; }
  .placeholder{ color:var(--text-muted); font-weight:700; font-size:.88rem; padding:10px 0; }

  [data-theme="dark"] {
    --bg-main: #1e1e1e;
    --bg-card: #2a2a2a;
    --bg-alt: #343434;
    --text-main: #e5e7eb;
    --text-muted: #a3a3a3;
    --border-color: #424242;
  }

  @media (max-width: 1120px){
    .workspace{ grid-template-columns: 1fr; }
    .leftRail{ position: static; max-height: none; }
    .name{ display:none; }
  }
</style>
</head>

<body>
<div class="container">
  <div class="workspace">
    <aside class="leftRail">
      <h1 class="title">⚛️ Periodisk tabell</h1>
      <p class="subtitle">Venstre panel som i ptable, med utvidede materialfiltre.</p>

      <div class="tempControl">
        <label>Temperatur <span class="tempValue" id="tempValue">298 K</span></label>
        <input type="range" id="tempSlider" min="0" max="5000" value="298" step="1">
      </div>

      <div class="searchPanel">
        <input id="searchInput" type="search" placeholder="Søk på navn, symbol, blokk, oppdager...">
        <select id="categoryFilter"></select>
        <select id="periodFilter">
          <option value="all">Alle perioder</option>
          <option value="1">Periode 1</option><option value="2">Periode 2</option><option value="3">Periode 3</option>
          <option value="4">Periode 4</option><option value="5">Periode 5</option><option value="6">Periode 6</option>
          <option value="7">Periode 7</option>
        </select>
        <select id="groupFilter">
          <option value="all">Alle grupper</option>
          <option value="1">Gruppe 1 (Alkalimetaller)</option>
          <option value="2">Gruppe 2 (Jordalkalimetaller)</option>
          <option value="13">Gruppe 13 (Boron-gruppen)</option>
          <option value="14">Gruppe 14 (Karbon-gruppen)</option>
          <option value="15">Gruppe 15 (Nitrogen-gruppen)</option>
          <option value="16">Gruppe 16 (Kalkogener)</option>
          <option value="17">Gruppe 17 (Halogener)</option>
          <option value="18">Gruppe 18 (Edelgasser)</option>
        </select>
        <select id="phaseFilter">
          <option value="all">Alle faser</option><option value="solid">Fast</option><option value="liquid">Væske</option><option value="gas">Gass</option><option value="unknown">Ukjent</option>
        </select>
        <select id="crystalFilter">
          <option value="all">Alle krystallstrukturer</option><option value="bcc">BCC</option><option value="fcc">FCC</option><option value="hcp">HCP</option><option value="cubic">Kubisk</option><option value="tetragonal">Tetragonal</option><option value="orthorhombic">Ortorombisk</option><option value="rhombohedral">Rombohedral</option><option value="hexagonal">Heksagonal</option><option value="molecular">Molekylær</option><option value="unknown">Ukjent</option>
        </select>
        <button id="resetFilters">Nullstill filter</button>
        <button id="clearSelection" class="secondary">Fjern valgt element</button>
        <div class="filterCount" id="filterCount">118 / 118 elementer</div>
      </div>

      <div class="quickFilters" id="quickFilters">
        <button class="quickBtn" data-quick="metall">Metaller</button>
        <button class="quickBtn" data-quick="ikke-metall">Ikke-metaller</button>
        <button class="quickBtn" data-quick="stp-gass">STP gasser</button>
        <button class="quickBtn" data-quick="struktur-bcc">BCC</button>
        <button class="quickBtn" data-quick="struktur-fcc">FCC</button>
        <button class="quickBtn" data-quick="radioaktiv">Radioaktive</button>
      </div>

      <div class="legend" id="legend"></div>

      <div class="infoPanel" id="infoPanel">
        <div class="infoMain">
          <div class="symbol" id="infoSymbol">—</div>
          <div class="name" id="infoName">Velg et element</div>
          <div class="meta" id="infoMeta">Klikk i tabellen for detaljer.</div>
        </div>
        <a id="infoWiki" class="quickBtn" href="#" target="_blank" rel="noopener noreferrer" style="display:none; margin-top:8px; text-decoration:none;">Åpne Wikipedia</a>
        <div id="infoSummary" class="placeholder" style="padding-top:8px;">Ingen element valgt.</div>
        <div class="infoGrid" id="infoGrid"><div class="placeholder">Ingen element valgt.</div></div>
      </div>
    </aside>

    <section class="rightRailCard">
      <div class="propertyTabs" id="propertyTabs">
        <button class="propertyTab active" data-property="atomic_mass">Atommasse</button>
        <button class="propertyTab" data-property="density">Tetthet</button>
        <button class="propertyTab" data-property="melt">Smeltepunkt</button>
        <button class="propertyTab" data-property="boil">Kokepunkt</button>
        <button class="propertyTab" data-property="electronegativity_pauling">Elektronegativitet</button>
        <button class="propertyTab" data-property="atomic_radius">Atomradius</button>
        <button class="propertyTab" data-property="first_ionization">1. ionisering</button>
        <button class="propertyTab" data-property="electron_affinity">Elektronaffinitet</button>
      </div>

      <div class="tableContainer">
        <div id="tableContent" class="loading">Laster periodisk tabell ...</div>
      </div>
    </section>
  </div>
</div>
<script src="periodic-table.js"></script>
<script src="/includes/mobile-enhancer.js"></script>
<script src="/assets/js/flyout-theme-updater.js"></script>
</body>
</html>

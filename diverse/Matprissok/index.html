<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sammenlign dagligvarepriser i norske butikker.">
  <title>Matprissøk | Finn laveste pris</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @media (max-width:640px){
      body{padding:.75rem;font-size:15px}.app-shell{padding:1.25rem .75rem 2rem}.masthead{margin-bottom:1.5rem}.masthead h1{font-size:clamp(2.8rem,16vw,4.5rem);line-height:.92}.lede{font-size:1.05rem;line-height:1.4;margin:1rem 0 1.25rem}.search-form{padding:.25rem;border-radius:12px}.search-form input{padding:.8rem .7rem;font-size:1rem}.search-form button{padding:.75rem .85rem}.toolbar{display:grid;grid-template-columns:1fr;gap:.65rem;padding:.85rem 0}.toolbar label{display:flex;align-items:center;justify-content:space-between;gap:.5rem}.toolbar select{flex:1;min-width:0;margin-left:auto;padding:.65rem}.check-label{justify-content:flex-start!important}.cart-button{width:100%;margin-left:0;padding:.8rem}.results{grid-template-columns:1fr;gap:.85rem}.product-card{grid-template-columns:5.5rem 1fr;gap:.75rem;padding:.75rem;border-radius:12px}.product-card img{width:5.5rem;height:5.5rem}.product-name{font-size:1.05rem;line-height:1.2}.price{font-size:1.15rem}.card-actions{display:grid;grid-template-columns:1fr;gap:.45rem}.card-actions button{width:100%;min-height:2.7rem}.cart-panel{inset:auto .75rem .75rem;max-height:80vh;width:auto}
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <p class="eyebrow">Norske dagligvarer</p>
      <h1>Matprissøk</h1>
      <p class="lede">Finn laveste registrerte pris på tvers av butikker.</p>
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">Søk etter matvare</label>
        <input id="search-input" name="q" type="search" autocomplete="off" placeholder="Søk etter en matvare..." minlength="2" maxlength="80">
        <button type="submit">Søk</button>
      </form>
      <div id="autocomplete" class="autocomplete" hidden></div>
    </header>

    <section class="toolbar" aria-label="Filtre og sortering">
      <label>Butikk <select id="store-filter"><option value="">Alle butikker</option></select></label>
      <label>Sorter <select id="sort-select"><option value="price">Laveste pris</option><option value="unit">Laveste enhetspris</option></select></label>
      <label class="check-label"><input id="priced-only" type="checkbox" checked> Kun varer med pris</label>
      <button id="cart-toggle" class="cart-button" type="button">Handleliste <span id="cart-count">0</span></button>
    </section>

    <p id="status" class="status" aria-live="polite">Søk etter en vare for å sammenligne priser.</p>
    <section id="results" class="results" aria-live="polite"></section>

    <aside id="cart-panel" class="cart-panel" hidden>
      <div class="section-head"><div><p class="eyebrow">Planlegg handelen</p><h2>Handleliste</h2></div><button id="cart-close" class="icon-button" type="button" aria-label="Lukk handleliste">×</button></div>
      <div id="cart-items"></div>
      <div class="cart-total"><span>Estimert totalsum</span><strong id="cart-total">0,00 kr</strong></div>
      <button id="cart-clear" class="quiet-button" type="button">Tøm listen</button>
    </aside>
  </main>

  <dialog id="product-dialog"><button id="dialog-close" class="dialog-close" type="button" aria-label="Lukk">×</button><div id="dialog-content"></div></dialog>
  <script src="app.js?v=2" type="module"></script>
</body>
</html>

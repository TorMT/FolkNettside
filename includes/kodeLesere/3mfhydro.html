<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3MF Hydrostatics Viewer</title>

  <style>
    :root{
      /* FolkNettsideFolk tokens (fallback) */
      --bg-main: var(--bg-main, var(--bg, #ffffff));
      --bg-card: var(--bg-card, var(--card-bg, #f7f8fb));
      --bg-alt:  var(--bg-alt, #f3f4f6);

      --text-main: var(--text-main, var(--text, #111827));
      --text-muted: var(--text-muted, rgba(17,24,39,.60));
      --border-color: var(--border-color, rgba(17,24,39,.14));
      --border-hover: var(--border-hover, rgba(17,24,39,.22));

      --primary: var(--primary, var(--theme-accent, var(--accent, #2f6fed)));
      --primary-contrast: #fff;

      --shadow: var(--shadow-lg, 0 12px 26px -14px rgba(0,0,0,.35));
      --shadow-soft: var(--shadow-md, 0 8px 18px -12px rgba(0,0,0,.25));

      --radius: var(--radius-lg, 16px);
      --radius-sm: var(--radius-md, 12px);
    }

    html,body{
      margin:0; padding:0; height:100%;
      overflow:hidden;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, Segoe UI, Arial;
    }

    /* Canvas fyller */
    #canvasHost{
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas{ display:block; }

    /* HUD */
    #hud{
      position:fixed; left:12px; top:12px; z-index:200;
      background: var(--bg-card);
      border:1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      padding:10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      max-width: min(520px, calc(100vw - 24px));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #hud.bad{
      border-color: rgba(239,68,68,.4);
      background: color-mix(in srgb, var(--bg-card) 85%, rgba(239,68,68,.08) 15%);
    }

    /* Toolbar */
    #uiWrap{
      position:fixed; left:50%; transform:translateX(-50%);
      top: 8px; z-index:180;
      width: min(1240px, calc(100vw - 24px));
      pointer-events:none;
    }
    #toolbar{
      pointer-events:auto;
      background: var(--bg-card);
      border:1px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding:10px 12px;
      display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    }

    .sep{ width:1px; height:30px; background:var(--border-color); }

    .btn{
      appearance:none;
      border:1px solid var(--border-color);
      background: color-mix(in srgb, var(--bg-main) 70%, var(--bg-card) 30%);
      color: var(--text-main);
      border-radius: 999px;
      padding:8px 12px;
      font-size: 13px;
      font-weight: 900;
      cursor:pointer;
      white-space:nowrap;
      user-select:none;
    }
    .btn:hover{ border-color: var(--border-hover); }
    .btn.primary{ background: var(--primary); color: var(--primary-contrast); border-color: color-mix(in srgb, var(--primary) 55%, var(--border-color) 45%); }
    .btn.ghost{ background:transparent; }

    /* Dropdown menus */
    .dd{ position:relative; }
    .ddBtn{ position:relative; }
    .ddBtn::after{ content:"▾"; margin-left:6px; font-size:10px; }
    .menu{
      position:absolute; top:calc(100% + 8px); left:0; z-index:300;
      background: var(--bg-card);
      border:1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      min-width: 280px;
      display:none;
    }
    .menu.show{ display:block; }
    .row{ display:flex; gap:8px; align-items:center; margin:4px 0; }
    .row label{ flex:1; font-weight:800; }
    .chk{ display:flex; align-items:center; gap:6px; }
    .chk input{ margin:0; }
    .chip{
      background: var(--primary);
      color: var(--primary-contrast);
      padding:2px 6px;
      border-radius:6px;
      font-size:11px;
      font-weight:900;
      margin-left:4px;
    }
    #materialModeBtn{
      position:fixed;
      right:12px;
      top:12px;
      z-index:205;
      width:46px;
      height:46px;
      border-radius:999px;
      border:1px solid var(--border-color);
      background: var(--bg-card);
      box-shadow: var(--shadow-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:20px;
      user-select:none;
    }
    #materialModeBtn::after{
      content: attr(data-mode);
      position:absolute;
      right:-4px;
      bottom:-4px;
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:999px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-size:10px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      text-transform:uppercase;
      box-shadow: var(--shadow-soft);
    }

    /* Help overlay */
    #helpOverlay{
      position:fixed; inset:0; z-index:500;
      background: rgba(0,0,0,.5);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
      transition: opacity .2s ease;
    }
    #helpOverlay.show{ opacity:1; pointer-events:auto; }
    .helpCard{
      background: var(--bg-card);
      border:1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 14px;
    }
    .helpHeader{ display:flex; flex-direction:column; gap:4px; padding: 6px 6px 10px 6px; }
    .helpTitle{ font-weight:900; font-size:16px; color:var(--text-main); }
    .helpSubtitle{ color:var(--text-muted); font-size:12px; }

    .helpGrid{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:12px;
    }
    .helpNav{ display:flex; flex-direction:column; gap:8px; }
    .helpNav .btn{
      width:100%;
      justify-content:flex-start;
      border-radius:12px;
      font-weight:900;
    }
    .helpNav .btn.active{
      background: var(--primary);
      color: var(--primary-contrast);
    }
    .helpContent{
      border:1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      background: color-mix(in srgb, var(--bg-main) 86%, var(--bg-card) 14%);
    }
    .helpContent h3{ margin:0 0 10px 0; }
    .helpContent p{ margin:6px 0; line-height:1.45; }
    .helpContent ul{ margin:6px 0 6px 18px; }

    /* Mobil */
    @media (max-width: 920px){
      .menu{ min-width: min(92vw, 420px); }
      .helpCard{ min-width: min(92vw, 420px); }
      .helpGrid{ grid-template-columns: 1fr; }
    }
    /* Rapport-drawer */
    .modal {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
      background-color: rgba(0,0,0,0.28);
      opacity: 0;
      transition: opacity .2s ease;
      backdrop-filter: blur(3px);
    }
    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: 24px 0 0 24px;
      box-shadow: var(--shadow);
      width: min(620px, 92vw);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      transform: translateX(24px);
      transition: transform .22s ease;
    }
    .modal.show .modal-content { transform: translateX(0); }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }
    .modal-title-wrap{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .modal-header h2 { margin: 0; color: var(--text-main); }
    .report-status-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .report-status{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:900; border:1px solid var(--border-color); background: var(--bg-alt); color: var(--text-main); }
    .report-status.is-stale{ background: color-mix(in srgb, #f59e0b 18%, var(--bg-card) 82%); color:#8a5200; border-color: rgba(245,158,11,.35); }
    .report-status.is-fresh{ background: color-mix(in srgb, #10b981 14%, var(--bg-card) 86%); color:#0a6c4d; border-color: rgba(16,185,129,.28); }
    .report-updated{ font-size:12px; color: var(--text-muted); }
    .report-actions{ display:flex; gap:8px; flex-wrap:wrap; padding: 14px 20px 0 20px; }
    .report-summary{ margin: 14px 20px 0 20px; padding: 14px 16px; border-radius: var(--radius-sm); border:1px solid var(--border-color); background: color-mix(in srgb, var(--bg-main) 80%, var(--bg-card) 20%); }
    .report-summary h3{ margin:0 0 8px 0; font-size:15px; }
    .report-summary p{ margin:0; color:var(--text-muted); line-height:1.5; font-size:13px; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    /* Tabs */
    #reportTabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--bg-alt); color: var(--text-main); border-radius: var(--radius-sm); cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Report table */
    #overviewTable { width: 100%; border-collapse: collapse; }
    #overviewTable th, #overviewTable td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border-color); }
    #overviewTable th { background: var(--bg-alt); font-weight: 600; width: 200px; }

    /* Curves */
    #curveContainer { display: flex; flex-direction: column; gap: 20px; }
    #curveContainer canvas { border: 1px solid var(--border-color); border-radius: var(--radius-sm); }

    /* Data */
    #dataContainer { display: flex; flex-direction: column; gap: 16px; }
    #rawData {
      background: var(--bg-alt);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }

    #loadingOverlay{
      position:fixed;
      inset:0;
      z-index:260;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding-top:96px;
      background: color-mix(in srgb, var(--bg-main) 84%, rgba(255,255,255,.35) 16%);
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease;
      backdrop-filter: blur(4px);
    }
    body.is-loading #loadingOverlay{
      opacity:1;
      pointer-events:auto;
    }
    body.is-loading #toolbar,
    body.is-loading #hydroDataWrap{
      opacity:0;
      pointer-events:none;
      transform: translateY(-8px);
    }
    #toolbar,
    #hydroDataWrap{
      transition: opacity .2s ease, transform .2s ease;
    }
    .loading-card{
      width:min(520px, calc(100vw - 32px));
      background: var(--bg-card);
      border:1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:20px 22px;
    }
    .loading-title{
      font-size: 18px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .loading-subtitle{
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .loading-bar{
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: color-mix(in srgb, var(--bg-main) 75%, var(--bg-card) 25%);
      border:1px solid var(--border-color);
    }
    .loading-bar::before{
      content:"";
      position:absolute;
      inset:0;
      width:38%;
      border-radius:inherit;
      background: linear-gradient(90deg, transparent 0%, var(--primary) 28%, color-mix(in srgb, var(--primary) 60%, white 40%) 68%, transparent 100%);
      animation: loading-slide 1.2s ease-in-out infinite;
    }
    @keyframes loading-slide{
      from{ transform: translateX(-130%); }
      to{ transform: translateX(320%); }
    }
  </style>
</head>

<body>

  <button id="materialModeBtn" title="Materialmodus: auto / pa / av" data-mode="auto">&#9680;</button>

  <!-- Hydrostatikk-data og komponent-liste -->
  <div id="hydroDataWrap">

        <div style="margin-bottom: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600;">VIS/SKJUL</div>

    <div id="hydroData">

          <tr><th>BMl</th><td id="hydro-bml">?</td></tr>
          <tr><th>LCF</th><td id="hydro-lcf">?</td></tr>
          <tr><th>TCF</th><td id="hydro-tcf">?</td></tr>
          <tr><th>Ixx</th><td id="hydro-ixx">?</td></tr>
          <tr><th>Iyy</th><td id="hydro-iyy">?</td></tr>
          <tr><th>Ixy</th><td id="hydro-ixy">?</td></tr>
          <tr><th>Waterplane-areal</th><td id="hydro-wp">?</td></tr>
          <tr><th>GZt</th><td id="hydro-gzt">?</td></tr>
          <tr><th>GZl</th><td id="hydro-gzl">?</td></tr>

      </table>
    </div>
  </div>
  <style>
    #hydroDataWrap {
      margin: 70px auto 0 auto;
      max-width: 900px;
      background: var(--bg-card, #f7f8fb);
      border-radius: 18px;
      box-shadow: 0 4px 24px -10px rgba(0,0,0,.10);
      padding: 18px 24px 18px 24px;

      gap: 32px;
      align-items: flex-start;

    }

      display: flex;

    }

      font-family: 'Consolas', 'Menlo', 'monospace';

      color: var(--text-main, #222);
    }

      #hydroDataWrap { flex-direction: column; gap: 18px; }
      #componentList { flex-direction: row; margin-right: 0; gap: 8px; }
    }
  </style>

  <script type="module">
    // Theme sync for iframes
    function copyThemeToIframe(){
      try{
        const parentRoot = window.parent.document.documentElement;
        const computed = getComputedStyle(parentRoot);
        const root = document.documentElement;

        // Copy CSS vars
        const vars = ["--bg","--bg-main","--bg-card","--bg-alt","--text","--text-main","--text-muted","--border-color","--border-hover","--primary","--shadow","--shadow-soft","--radius","--radius-sm","--theme-accent","--accent"];
        vars.forEach(v => {
          const val = computed.getPropertyValue(v) || parentRoot.style.getPropertyValue(v);
          if(val) root.style.setProperty(v, val);
        });

        // Copy data-theme
        const theme = parentRoot.getAttribute("data-theme");
        if(theme) root.setAttribute("data-theme", theme);
      }catch{}
    }
    copyThemeToIframe();
    try{
      const parentRoot = window.parent.document.documentElement;
      const mo = new MutationObserver(() => copyThemeToIframe());
      mo.observe(parentRoot, { attributes: true, attributeFilter: ["data-theme","style","class"] });
    }catch{}
    setInterval(copyThemeToIframe, 500);

    // --- Imports (MODULER) ---
    import * as THREE from "/includes/three/three.module.js";

    import { STLViewerCore } from "/includes/three/STLViewerCore.js";
    import { ModelLoader } from "/includes/three/ModelLoader.js";
    import { HydroStatikk } from "/includes/three/HydroStatikk.js";
    import { UIController } from "/includes/three/UIController.js";
    import { ClippingController } from "/includes/three/ClippingController.js";
    import { MeasureController } from "/includes/three/MeasureController.js";
    import { AlignHelpers } from "/includes/three/AlignHelpers.js";
    import { detectLang, getHelpData } from "/includes/three/HelpMenu.i18n.js";

    const hud = document.getElementById("hud");

    function setHud(msg, isBad=false){
      if (hud) {
        hud.textContent = msg;
        hud.classList.toggle("bad", !!isBad);
      }
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const hydroDataWrap = document.getElementById("hydroDataWrap");

    function setLoadingState(isLoading, message = "Laster modell...") {
      document.body.classList.toggle("is-loading", !!isLoading);
      if (loadingText) loadingText.textContent = message;
      if (loadingOverlay) loadingOverlay.setAttribute("aria-busy", isLoading ? "true" : "false");
      if (hydroDataWrap && !isLoading) hydroDataWrap.style.visibility = "visible";
    }

    if (hydroDataWrap) hydroDataWrap.style.visibility = "hidden";

    function applyRuntimeTextFixes() {
      const style = document.createElement("style");
      style.textContent = `
        .ddBtn::after{ content:"\\25BE" !important; margin-left:6px; font-size:10px; }
      `;
      document.head.appendChild(style);

      setText("hud", "Laster 3MF...");
      if (loadingText) loadingText.textContent = fallbackMode ? "3MF og komponentdata klargj\u00F8res..." : "3MF og hydrodata klargj\u00F8res...";
      const mobileMenuBtn = document.getElementById("btnMobileMenu");
      if (mobileMenuBtn) mobileMenuBtn.textContent = "\u2630";
      const materialModeBtn = document.getElementById("materialModeBtn");
      if (materialModeBtn) materialModeBtn.title = "Materialmodus: auto / p\u00E5 / av";
    }

    applyRuntimeTextFixes();

    const viewParams = new URLSearchParams(location.search);
    const fallbackMode = /^(1|true)$/i.test(viewParams.get("fallback") || "");
    const altFile = viewParams.get("altFile") || "";
    let usedAltFile = false;

    function scoreFallbackCandidate(name, sourceStem) {
      const stem = String(name || '').replace(/\.[^.]+$/i, '').toLowerCase();
      const tokens = [...new Set(String(sourceStem || '').split(/[_\-\s]+/).filter(Boolean))];
      return (
        (stem === sourceStem ? 100 : 0) +
        ((stem.includes(sourceStem) || sourceStem.includes(stem)) ? 80 : 0) +
        tokens.filter((token) => stem.includes(token)).length
      );
    }

    async function resolveAutoFallbackCandidate(url) {
      try {
        const cleanUrl = String(url || '').split('?')[0].split('#')[0];
        const sourceStem = cleanUrl.split('/').pop().replace(/\.[^.]+$/i, '').toLowerCase();
        const basePath = cleanUrl.replace(/[^\/]+$/, '');
        if (!basePath) return '';
        const res = await fetch(`${basePath}index.json`, { cache: 'no-store' });
        if (!res.ok) return '';
        const data = await res.json();
        const candidates = [];
        Object.values(data || {}).forEach((value) => {
          if (!value || !Array.isArray(value.files)) return;
          value.files.forEach((file) => {
            if (typeof file !== 'string') return;
            if (/\.(3mf|3fm|fm3|stl)(?:$|[?#])/i.test(file)) candidates.push(file);
          });
        });
        const unique = [...new Set(candidates)];
        if (!unique.length) return '';
        const ranked = unique.map((name) => {
          const lower = String(name).toLowerCase();
          const extWeight =
            /\.3mf(?:$|[?#])/.test(lower) ? 400 :
            /\.3fm(?:$|[?#])/.test(lower) ? 390 :
            /\.fm3(?:$|[?#])/.test(lower) ? 380 :
            /\.stl(?:$|[?#])/.test(lower) ? 300 : 0;
          return { name, score: extWeight + scoreFallbackCandidate(name, sourceStem) };
        }).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'nb'));
        const chosen = ranked[0];
        if (!chosen || chosen.score <= 0) return '';
        return `${basePath}${chosen.name}`;
      } catch {
        return '';
      }
    }

    function shouldAutoTranslucent(targetObject) {
      if (!targetObject || !hydro?.mesh) return false;
      const targetBox = new THREE.Box3().setFromObject(targetObject);
      if (targetBox.isEmpty()) return false;
      const targetSize = new THREE.Vector3();
      targetBox.getSize(targetSize);
      const targetVolume = Math.max(targetSize.x * targetSize.y * targetSize.z, 1e-9);
      let inside = false;
      hydro.mesh.traverse((child) => {
        if (inside || !child || child === targetObject || !child.isMesh) return;
        const childBox = new THREE.Box3().setFromObject(child);
        if (childBox.isEmpty()) return;
        const childSize = new THREE.Vector3();
        childBox.getSize(childSize);
        const childVolume = childSize.x * childSize.y * childSize.z;
        const contains =
          childBox.min.x <= targetBox.min.x && childBox.min.y <= targetBox.min.y && childBox.min.z <= targetBox.min.z &&
          childBox.max.x >= targetBox.max.x && childBox.max.y >= targetBox.max.y && childBox.max.z >= targetBox.max.z;
        if (contains && childVolume > targetVolume * 1.15) inside = true;
      });
      return inside;
    }

    function focusCameraOnObject(object) {
      if (!object || !core?.camera || !core?.controls) return;
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z, 0.1);
      const dist = maxDim * 2.2;
      core.controls.target.copy(center);
      core.camera.position.set(center.x + dist, center.y + dist, center.z + dist * 0.7);
      core.camera.near = Math.max(0.001, maxDim / 1000);
      core.camera.far = Math.max(100, maxDim * 1000);
      core.camera.updateProjectionMatrix();
      core.controls.update();
    }

    function buildComponentList(mesh) {
      const componentList = document.getElementById('componentList');
      if (!componentList || !mesh) return [];

      const existingChips = componentList.querySelectorAll('.component-chip:not([data-static])');
      existingChips.forEach(chip => chip.remove());

      const dynamicComponents = [];
      mesh.traverse(child => {
        if (!child || child === mesh || !child.name || !child.isMesh) return;
        const exactName = String(child.userData?.componentName || child.name || '').trim();
        if (!exactName) return;
        const lowerName = exactName.toLowerCase();
        let compType = 'component';
        if (lowerName.includes('thruster') || lowerName.includes('propeller')) compType = 'thrusters';
        else if (lowerName.includes('battery') || lowerName.includes('batt')) compType = 'batteries';
        else if (lowerName.includes('sensor') || lowerName.includes('lidar') || lowerName.includes('camera')) compType = 'sensors';
        else compType = lowerName.replace(/[^a-z0-9]/g, '') || 'component';
        dynamicComponents.push({ comp: compType, name: exactName });
      });
      if (!dynamicComponents.length) {
        postViewerComponents([], "mesh");
        return [];
      }

      const standardComps = new Set(['hull', 'wl', 'cb', 'cg', 'wp']);
      const insertAfter = componentList.querySelector('.component-chip[data-comp="wp"]');
      let insertAnchor = insertAfter;
      const displayCounts = new Map();
      const postedNames = [];

      dynamicComponents.forEach(comp => {
        if (!comp?.comp || !comp.name || standardComps.has(comp.comp)) return;
        const count = (displayCounts.get(comp.name) || 0) + 1;
        displayCounts.set(comp.name, count);
        const chip = document.createElement('span');
        chip.className = 'component-chip';
        chip.setAttribute('data-comp', comp.comp);
        chip.setAttribute('data-target', `name:${comp.name}`);
        chip.textContent = count > 1 ? `${comp.name} (${count})` : comp.name;
        postedNames.push(chip.textContent);
        if (insertAnchor?.parentNode) {
          insertAnchor.parentNode.insertBefore(chip, insertAnchor.nextSibling);
          insertAnchor = chip;
        } else {
          componentList.appendChild(chip);
          insertAnchor = chip;
        }
      });

      document.querySelectorAll('.component-chip').forEach(chip => {
        const target = chip.dataset.target || chip.dataset.comp;
        chip.onmouseenter = () => {};
        chip.onmouseleave = () => {
          if (highlightedComponent !== target) chip.classList.remove('active');
        };
        chip.onclick = () => {
          document.querySelectorAll('.component-chip').forEach(c => {
            if (c !== chip) c.classList.remove('active');
          });
          if (highlightedComponent === target) {
            chip.classList.remove('active');
            highlightedComponent = null;
            highlightComponent(null, false, false);
          } else {
            chip.classList.add('active');
            highlightedComponent = target;
            highlightComponent(target, true, true);
          }
        };
      });

      postViewerComponents(postedNames, "mesh");
      return postedNames;
    }

    function highlightComponent(compName, highlight, focus = false) {
      if (!hydro || !hydro.mesh) return;

      if (!highlight || !compName) {
        hydro.mesh.traverse((child) => {
          if (!child.material) return;
          child.material.opacity = 1.0;
          child.material.transparent = false;
          child.material.emissive?.setHex(0x000000);
          child.material.needsUpdate = true;
        });
        return;
      }

      let focusObject = null;
      const matchedObjects = [];
      hydro.mesh.traverse((child) => {
        if (!child.material) return;
        const childName = String(child.name || '').toLowerCase();
        const childData = String(child.userData?.componentName || child.userData?.component || '').toLowerCase();
        const target = String(compName || '').toLowerCase();
        const exactTarget = target.startsWith('name:') ? target.slice(5) : null;

        const isTarget =
          (exactTarget && (childName === exactTarget || childData === exactTarget)) ||
          childName === target ||
          childData === target ||
          (target === 'hull' && child === hydro.mesh) ||
          (target === 'wl' && child === hydro.wlContour) ||
          (target === 'cb' && child === hydro.cbMarker) ||
          (target === 'cg' && child === hydro.cgMarker) ||
          (target === 'wp' && child === hydro.waterPlane) ||
          (target === 'thrusters' && (childName.includes('thruster') || childName.includes('propeller') || childData === 'thrusters')) ||
          (target === 'batteries' && (childName.includes('battery') || childName.includes('batt') || childData === 'batteries')) ||
          (target === 'sensors' && (childName.includes('sensor') || childName.includes('lidar') || childName.includes('camera') || childData === 'sensors'));

        if (isTarget) {
          child.material.opacity = 1.0;
          child.material.transparent = false;
          child.material.emissive?.setHex(0x000000);
          matchedObjects.push(child);
          if (!focusObject && child.isObject3D) focusObject = child;
        }
      });
      const useTranslucentOthers =
        materialMode === 'on' ||
        (materialMode === 'auto' && matchedObjects.some(obj => shouldAutoTranslucent(obj)));
      hydro.mesh.traverse((child) => {
        if (!child.material) return;
        const isTarget = matchedObjects.includes(child);
        if (isTarget) {
          child.material.opacity = 1.0;
          child.material.transparent = false;
          child.material.emissive?.setHex(0x000000);
        } else if (useTranslucentOthers) {
          child.material.opacity = 0.18;
          child.material.transparent = true;
          child.material.emissive?.setHex(0x000000);
        } else {
          child.material.opacity = 1.0;
          child.material.transparent = false;
          child.material.emissive?.setHex(0x000000);
        }
        child.material.needsUpdate = true;
      });
      if (focus && focusObject) focusCameraOnObject(focusObject);
    }

    async function loadModel(url) {
      if(!url) {

      }
      if(!url.startsWith("http") && !url.startsWith("/")) url = "/" + url;
      console.info("[3mfhydro] modelUrl:", url);

      // Loader timeout (stopper uendelig "Laster...")
      const TIMEOUT_MS = 12000;
      let timedOut = false;
      const to = setTimeout(() => {
        timedOut = true;
        setHud("Init timeout (12s). Sjekk console (404/import) eller filsti.", true);
        setLoadingState(true, "Lasting tar lengre tid enn forventet...");

        let headStatus = 0;
        try {
          const headRes = await fetch(url, { method: "HEAD" });
          headStatus = headRes.status;
          console.info("[3mfhydro] HEAD:", { url, status: headStatus, ok: headRes.ok });
          if (!headRes.ok) {
            headOk = false;
          }
        } catch (e) {
          console.error("[3mfhydro] HEAD feilet:", url, e);
          headOk = false;
        }
        if (!headOk) {
          clearTimeout(to);
          setLoadingState(false);
          setHud(`Finner ikke filen (HEAD-feil, status ${headStatus}) på: ${url}`, true);
          return;
        }

        setLoadingState(true, "Bygger modell og komponenter...");
        const loader = new ModelLoader();
        const { mesh, geometry, volume, centroidLocal } = await loader.load(url);

        clearTimeout(to);
        if(timedOut) throw new Error("Init timeout");

        core.setMesh(mesh);
        hydro.setMesh(mesh);

        // Bygg dynamisk komponentliste basert på modellen
        buildComponentList(mesh);

        applyVisibilitySettings(); // Apply saved visibility settings to 3D elements
        let hydroErr = null;
        if (!fallbackMode) {
          if (typeof hydro.initDraftAtOriginalPlane === "function") hydro.initDraftAtOriginalPlane();
          else hydro.initDraftAtBottom();
          setLoadingState(true, "Beregner hydrostatikk...");
          try {
            await hydro.recompute();
            await updateHydroAfterLoad();
          } catch (errHydro) {
            hydroErr = errHydro;
            console.error("[3mfhydro] Hydro-beregning feilet:", errHydro);
          }
        }

        ui.afterModelLoaded({ mesh, geometry, volume, centroidLocal, modelUrl: url });

        const btnReset = document.getElementById("btnReset");

          if(e.shiftKey){
            core.rotateUser("y", Math.PI);
            setHud("Flip (Y 180°)", false);

        core.start();
        if (!fallbackMode) syncHydroVisibility();
        setLoadingState(false);
        if (fallbackMode) {
          setHud("Klar - 3MF lastet med komponenter");
        } else if (hydroErr) {
          setHud(`3MF lastet, men hydrostatikk feilet: ${hydroErr.message || hydroErr}`, true);
        } else {
          setHud("Klar - 3MF lastet med hydrostatikk");
        }
      }catch(err){
        const fallbackTarget = (!usedAltFile && altFile && url !== altFile)
          ? altFile
          : (!usedAltFile && fallbackMode ? await resolveAutoFallbackCandidate(url) : "");
        if (!usedAltFile && fallbackTarget && url !== fallbackTarget) {

          console.warn("[3mfhydro] Direkte lasting feilet, prøver fallback-preview:", { url, fallbackTarget, err });

        setLoadingState(false);
        setHud(msg, true);

      return `Fordrengt volum ${volume}, estimert deplasement ${disp} tonn, draft ${draft}, trim ${trim}\u00B0, heel ${heel}\u00B0, GMt ${gmt} og GMl ${gml}.`;

    function drawSimpleCurve(ctx, xData, yData, title, xLabel, yLabel) {
      const canvas = ctx.canvas;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!xData || !yData || xData.length === 0) return;

      // Simple plot uten Chart.js
      const margin = 60;
      const w = canvas.width - 2 * margin;
      const h = canvas.height - 2 * margin;

      const xMin = Math.min(...xData);
      const xMax = Math.max(...xData);
      const yMin = Math.min(...yData.filter(v => v != null));
      const yMax = Math.max(...yData.filter(v => v != null));

      // Grid
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const x = margin + (i / 10) * w;
        const y = margin + (i / 10) * h;
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, canvas.height - margin);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(canvas.width - margin, y);
        ctx.stroke();
      }

      // Curve
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2;
      ctx.beginPath();

      for (let i = 0; i < xData.length; i++) {
        if (yData[i] == null) continue;
        const x = margin + ((xData[i] - xMin) / (xMax - xMin)) * w;
        const y = canvas.height - margin - ((yData[i] - yMin) / (yMax - yMin)) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Axis labels
      ctx.textAlign = 'center';
      ctx.fillText(xLabel, canvas.width / 2, canvas.height - 10);

      ctx.save();
      ctx.translate(15, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();
    }

        async function ensureJsPdf() {
      if (window.jspdf?.jsPDF) return window.jspdf.jsPDF;

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Kunne ikke laste jsPDF'));

    function buildPdfLines(bundle) {

    async function exportReportPDF(bundle) {
      try {
        const JsPdf = await ensureJsPdf();
        if (!JsPdf) throw new Error('jsPDF utilgjengelig');
        const doc = new JsPdf({ unit: 'mm', format: 'a4' });
        const lines = buildPdfLines(bundle);
        let y = 18;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.text('Hydrostatikkrapport', 16, y);
        y += 10;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        lines.slice(1).forEach((line) => {
          const wrapped = doc.splitTextToSize(String(line), 178);
          wrapped.forEach((part) => {
            if (y > 280) {
              doc.addPage();
              y = 18;
            }
            doc.text(part, 16, y);
            y += 6;
          });
        });
        doc.save('hydro_report.pdf');
      } catch (err) {
        console.warn('[3mfhydro] PDF-eksport feilet, bruker print-fallback:', err);
        const win = window.open('', '_blank', 'width=900,height=1200');
        if (!win) return;
        win.document.write(<!doctype html><html lang="no"><head><meta charset="utf-8"><title>Hydrostatikkrapport</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:32px;color:#111}h1{margin:0 0 18px}pre{white-space:pre-wrap;line-height:1.5;font:14px/1.5 Segoe UI,Arial,sans-serif}</style></head><body><h1>Hydrostatikkrapport</h1><pre></pre></body></html>);
        win.document.close();
        win.focus();
        win.print();
      }
    }function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

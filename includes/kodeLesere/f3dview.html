<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD-visning</title>
  <style>
    :root{
      --bg-main: var(--bg-main, var(--bgcolor, #ffffff));
      --bg-card: var(--bg-card, var(--card-bg, #f7f8fb));
      --bg-soft: color-mix(in srgb, var(--bg-main) 86%, var(--bg-card) 14%);
      --text-main: var(--text-main, var(--textcolor, #111827));
      --text-muted: var(--text-muted, rgba(17,24,39,.60));
      --border-color: var(--border-color, rgba(17,24,39,.14));
      --primary: var(--primary, var(--accent, #2f6fed));
      --primary-contrast: #fff;
      --shadow-soft: 0 8px 18px -12px rgba(0,0,0,.25);
      --radius: 16px;
      --radius-sm: 12px;
    }

    html,body{
      margin:0;
      padding:0;
      height:100%;
      overflow:hidden;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, Segoe UI, Arial, sans-serif;
    }

    #hud{
      position:fixed;
      left:12px;
      top:12px;
      z-index:50;
      background: var(--bg-card);
      border:1px solid var(--border-color);
      box-shadow: var(--shadow-soft);
      padding:10px 12px;
      border-radius: var(--radius-sm);
      font-size:13px;
      line-height:1.35;
      max-width:min(760px, 92vw);
    }

    body.is-embedded #hud{
      display:none;
    }

    .stage{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      background:var(--bg-main);
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      background:transparent;
    }

    .card{
      width:min(1100px, calc(100vw - 32px));
      max-height:calc(100vh - 32px);
      overflow:auto;
      background:var(--bg-card);
      border:1px solid var(--border-color);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
      padding:20px;
    }

    .card h2{
      margin:0 0 10px 0;
      font-size:26px;
    }

    .card p{
      margin:0 0 12px 0;
      color:var(--text-muted);
      line-height:1.5;
    }

    .grid{
      display:grid;
      grid-template-columns:minmax(280px, 360px) 1fr;
      gap:16px;
      align-items:start;
    }

    .panel{
      background:var(--bg-soft);
      border:1px solid var(--border-color);
      border-radius:var(--radius-sm);
      padding:16px;
    }

    .panel h3{
      margin:0 0 12px 0;
      font-size:18px;
    }

    .thumb{
      width:100%;
      max-height:260px;
      object-fit:contain;
      border-radius:12px;
      border:1px solid var(--border-color);
      background:color-mix(in srgb, var(--bg-card) 78%, #000 22%);
    }

    .preview-shell{
      width:100%;
      min-height:340px;
      border-radius:12px;
      border:1px solid var(--border-color);
      overflow:hidden;
      background:color-mix(in srgb, var(--bg-card) 80%, #000 20%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .preview-shell iframe{
      width:100%;
      height:clamp(340px, 52vh, 640px);
      display:block;
      border:none;
      background:transparent;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:16px 0;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--border-color);
      background:var(--bg-main);
      color:var(--text-main);
      text-decoration:none;
      font-weight:800;
      cursor:pointer;
    }

    .btn.primary{
      background:var(--primary);
      color:var(--primary-contrast);
      border-color:var(--primary);
    }

    .meta-list,
    .component-list{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .meta-list li,
    .component-list li{
      padding:10px 12px;
      border:1px solid var(--border-color);
      border-radius:10px;
      background:var(--bg-main);
    }

    .muted{
      color:var(--text-muted);
      font-size:13px;
    }

    code,
    pre{
      display:block;
      margin:0;
      padding:10px 12px;
      background: color-mix(in srgb, var(--bg-card) 85%, #000 15%);
      border-radius:10px;
      overflow:auto;
      font-size:12px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    @media (max-width: 920px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>CAD-visning</strong><br>
    <small id="hudText">Klargjør forhåndsvisning...</small>
  </div>

  <div id="stage" class="stage"></div>

  <script>
    function applyThemePayload(payload) {
      try {
        const root = document.documentElement;
        if (payload && payload.themeAttr) root.setAttribute("data-theme", payload.themeAttr);
        const vars = payload?.vars || {};
        Object.keys(vars).forEach((k) => root.style.setProperty(k, vars[k]));
      } catch {}
    }

    window.addEventListener("message", (e) => {
      if (e?.data?.type === "theme-sync") applyThemePayload(e.data);
    });

    try {
      if (window.parent && window.parent !== window) {
        const parentRoot = window.parent.document.documentElement;
        const parentStyle = getComputedStyle(parentRoot);
        const vars = {};
        for (let i = 0; i < parentStyle.length; i++) {
          const name = parentStyle[i];
          if (name.startsWith("--")) vars[name] = parentStyle.getPropertyValue(name).trim();
        }
        applyThemePayload({ themeAttr: parentRoot.getAttribute("data-theme"), vars });
      }
    } catch {}

    const params = new URLSearchParams(window.location.search);
    const previewFile = params.get("file");
    const sourceFile = params.get("sourceFile") || previewFile;
    const stlCandidate = params.get("stlCandidate");
    const sourceExt = (params.get("sourceExt") || "").toLowerCase();
    const embedded = params.get("embedded") === "1";
    const stage = document.getElementById("stage");
    const hudText = document.getElementById("hudText");
    const fileName = (sourceFile || "").split("/").pop();

    if (embedded) document.body.classList.add("is-embedded");

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[ch]));
    }

    async function exists(url) {
      if (!url) return false;
      try {
        const res = await fetch(url, { method: "HEAD", cache: "no-store" });
        return res.ok;
      } catch {
        return false;
      }
    }

    async function ensureJsZip() {
      if (window.JSZip) return window.JSZip;
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Kunne ikke laste JSZip"));
        document.head.appendChild(script);
      });
      return window.JSZip;
    }

    async function readJsonIfExists(zip, name) {
      const entry = zip.file(name);
      if (!entry) return null;
      try {
        return JSON.parse(await entry.async("string"));
      } catch {
        return null;
      }
    }

    async function readPreviewFromF3d(zip) {
      const entries = zip.file(/(^|\/)Previews\/small\.png$/i);
      const entry = entries && entries[0];
      if (!entry) return null;
      const blob = await entry.async("blob");
      return URL.createObjectURL(blob);
    }

    function renderPreviewViewer(url) {
      hudText.textContent = `Viser lokal 3D-forhåndsvisning for .${sourceExt || "cad"}`;
      const iframe = document.createElement("iframe");
      iframe.title = "CAD preview";
      iframe.src = `/includes/kodeLesere/stlview.html?file=${encodeURIComponent(url)}`;
      stage.replaceChildren(iframe);
    }

    function renderFallback(reason) {
      hudText.textContent = "Ingen lokal CAD-preview funnet";
      stage.innerHTML = `
        <div class="card">
          <h2>Ingen direkte CAD-preview</h2>
          <p>${escapeHtml(reason)}</p>
          <p>Vi viser ikke tredjeparts toppmeny her. Hvis det finnes en matchende STL-eksport, vil den brukes automatisk.</p>
          <div class="buttons">
            <a class="btn primary" href="${sourceFile}" target="_blank" rel="noopener">Åpne originalfil</a>
            ${stlCandidate ? `<a class="btn" href="/includes/kodeLesere/stlview.html?file=${encodeURIComponent(stlCandidate)}" target="_blank" rel="noopener">Prøv STL-visning</a>` : ""}
          </div>
          <code>${escapeHtml(sourceFile || "Ingen fil mottatt")}</code>
        </div>
      `;
    }

    async function renderFusionOpener() {
      const JSZip = await ensureJsZip();
      hudText.textContent = "Leser Fusion-container...";
      const res = await fetch(sourceFile, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const outer = await JSZip.loadAsync(await res.arrayBuffer());

      const manifest = await readJsonIfExists(outer, "Manifest.json");
      const designDescription = await readJsonIfExists(outer, "DesignDescription.json");
      const rootFile = manifest?.root || null;
      const designObjects = designDescription?.designDescription?.designGraphs?.[0]?.designObjects || [];
      const rootObject = designObjects.find((obj) => obj.relativePath === rootFile) || designObjects[0] || null;

      let previewUrl = null;
      const hasStlPreview = stlCandidate && await exists(stlCandidate);
      if (rootFile) {
        const rootEntry = outer.file(rootFile);
        if (rootEntry) {
          try {
            const inner = await JSZip.loadAsync(await rootEntry.async("arraybuffer"));
            previewUrl = await readPreviewFromF3d(inner);
          } catch {}
        }
      }

      const components = designObjects.map((obj) => ({
        name: obj.displayName || obj.friendlyName || obj.relativePath || "Ukjent komponent",
        type: obj.contentType || "ukjent",
        file: obj.relativePath || "",
        description: obj.metadata?.description || "",
      }));
      const entries = Object.keys(outer.files).sort((a, b) => a.localeCompare(b, "nb"));

      hudText.textContent = "Fusion-åpner klar";
      stage.innerHTML = `
        <div class="card">
          <h2>${escapeHtml(rootObject?.displayName || fileName || "Fusion-fil")}</h2>
          <p>Lokal åpner for .${escapeHtml(sourceExt || "f3z")} med assembly-data hentet direkte fra selve filcontaineren. STL brukes bare som valgfri fallback, ikke som primærvisning.</p>
          <div class="buttons">
            <a class="btn primary" href="${sourceFile}" target="_blank" rel="noopener">Åpne originalfil</a>
            ${stlCandidate ? `<a class="btn" href="/includes/kodeLesere/stlview.html?file=${encodeURIComponent(stlCandidate)}" target="_blank" rel="noopener">Åpne STL-fallback</a>` : ""}
          </div>
          <div class="grid">
            <div class="panel">
              <h3>Preview fra filen</h3>
              ${previewUrl
                ? `<img class="thumb" src="${previewUrl}" alt="Preview av modellen">`
                : `<div class="muted">Ingen intern preview funnet i filcontaineren. Du kan fortsatt bruke STL-fallbacken hvis du vil se en mesh-visning.</div>`}
              <ul class="meta-list" style="margin-top:12px;">
                <li><strong>Rotfil</strong><br><span class="muted">${escapeHtml(rootFile || "ukjent")}</span></li>
                <li><strong>Komponenter</strong><br><span class="muted">${components.length}</span></li>
                <li><strong>Container entries</strong><br><span class="muted">${entries.length}</span></li>
                <li><strong>STL-fallback</strong><br><span class="muted">${escapeHtml((stlCandidate || "").split("/").pop() || "ingen")}${hasStlPreview ? " · tilgjengelig" : ""}</span></li>
              </ul>
            </div>
            <div style="display:grid; gap:16px;">
              <div class="panel">
                <h3>Komponenter</h3>
                <ul class="component-list">
                  ${components.length ? components.map((item) => `
                    <li>
                      <strong>${escapeHtml(item.name)}</strong><br>
                      <span class="muted">${escapeHtml(item.type)}${item.file ? ` · ${escapeHtml(item.file)}` : ""}${item.description ? `<br>${escapeHtml(item.description)}` : ""}</span>
                    </li>
                  `).join("") : "<li>Ingen komponenter funnet.</li>"}
                </ul>
              </div>
              <div class="panel">
                <h3>Filer i containeren</h3>
                <pre>${escapeHtml(entries.slice(0, 140).join("\n"))}</pre>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function init() {
      hudText.textContent = "Sjekker lokal forhåndsvisning...";
      const checkedStl = stlCandidate && await exists(stlCandidate) ? stlCandidate : "";
      const preferredPreview = checkedStl || previewFile;
      const isRenderableMesh = preferredPreview && /\.stl(?:$|[?#])/i.test(preferredPreview);

      if (["f3z", "3fz", "f3d"].includes(sourceExt)) {
        if (isRenderableMesh) {
          hudText.textContent = "Viser 3D-forhåndsvisning for Fusion-filen";
          renderMeshPreview(preferredPreview);
          return;
        }
        if (embedded) {
          if (stlCandidate) {
            hudText.textContent = "Bruker STL-fallback for 3D-visning";
            renderMeshPreview(stlCandidate);
            return;
          }
          renderFallback(`Fant ingen lokal 3D-forhåndsvisning for .${sourceExt || "ukjent"}. Bruk råfil eller STL-fallback fra sidepanelet.`);
          return;
        }
        await renderFusionOpener();
        return;
      }

      if (isRenderableMesh) {
        renderMeshPreview(preferredPreview);
        return;
      }

      renderFallback(`Filtypen .${sourceExt || "ukjent"} har foreløpig ikke en lokal nettleser-renderer som gir riktig modell uten tredjepartsgrensesnitt.`);
    }

    init().catch((err) => {
      console.error("[f3dview] init failed", err);
      renderFallback(`Kunne ikke åpne filtypen .${sourceExt || "ukjent"} lokalt: ${err?.message || err}`);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>HTML viewer</title>
<style>
  html,body{ margin:0; padding:0; height:100%; background:#fff; }
  body{ display:flex; flex-direction:column; font-family:system-ui,-apple-system,sans-serif; }
  #external-toolbar{ display:none; align-items:center; gap:12px; padding:9px 14px; color:#e5e7eb; background:#111827; border-bottom:1px solid #374151; }
  #external-toolbar.visible{ display:flex; }
  #external-status{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.9rem; }
  #open-external{ border:1px solid #60a5fa; border-radius:7px; padding:6px 10px; color:#fff; background:#2563eb; font-weight:700; cursor:pointer; }
  iframe{ width:100%; flex:1; min-height:0; border:none; }
</style>
  <script src="/FolkNettside/includes/kodeLesere/locked-view.js" defer></script>
</head>
<body>
<div id="external-toolbar" role="status">
  <span id="external-status">Laster ekstern side…</span>
  <button id="open-external" type="button">&Aring;pne i ny fane</button>
</div>
<iframe id="frame"></iframe>

<script>
  const params = new URLSearchParams(location.search);
  const file = params.get("file");
  const frame = document.getElementById("frame");
  const toolbar = document.getElementById("external-toolbar");
  const externalStatus = document.getElementById("external-status");
  const openExternal = document.getElementById("open-external");
  let _statusSent = false;

  function resolveViewerUrl(value){
    if (!String(value || '').trim()) return null;
    try{
      const resolved = new URL(value, location.href);
      if (resolved.protocol !== 'http:' && resolved.protocol !== 'https:') return null;
      return resolved;
    }catch(e){
      return null;
    }
  }

  const resolvedFile = resolveViewerUrl(file);
  const isExternal = !!resolvedFile && resolvedFile.origin !== location.origin;

  function sendStatus(status){
    if (_statusSent && status !== 'loaded') return;
    if (status === 'loaded') _statusSent = true;
    try{
      window.parent.postMessage({ type: 'htmlview-status', status, file }, location.origin);
    }catch(e){}
  }

  if (!resolvedFile) {
    document.body.innerHTML = "<h3>Ugyldig eller manglende filadresse</h3>";
    throw new Error("Invalid or missing ?file=");
  }

  if (isExternal){
    toolbar.classList.add('visible');
    externalStatus.textContent = `Viser ${resolvedFile.hostname}. Hvis siden blokkerer innebygd visning, bruk knappen til høyre.`;
    openExternal.addEventListener('click', () => window.open(resolvedFile.href, '_blank', 'noopener'));
  }

  // --- THEME SYNC ---
  function copyThemeToIframe() {
    try {
      const parentRoot = window.parent.document.documentElement;
      const parentStyle = getComputedStyle(parentRoot);

      const doc = frame.contentDocument;
      if (!doc) return;

      const childRoot = doc.documentElement;

      // speil data-theme (dark/light)
      const themeAttr = parentRoot.getAttribute("data-theme");
      if (themeAttr) childRoot.setAttribute("data-theme", themeAttr);
      else childRoot.removeAttribute("data-theme");

      // kopier alle CSS custom properties (--) fra parent
      // (tar også med de du bruker: --bg-main, --primary osv.)
      for (let i = 0; i < parentStyle.length; i++) {
        const name = parentStyle[i];
        if (!name.startsWith("--")) continue;
        const val = parentStyle.getPropertyValue(name);
        if (val) childRoot.style.setProperty(name, val.trim());
      }

      // --- Forward theme + vars to nested iframe child (hvis tilstede) ---
      try {
        const vars = {};
        for (let i = 0; i < parentStyle.length; i++) {
          const name = parentStyle[i];
          if (!name.startsWith("--")) continue;
          const val = parentStyle.getPropertyValue(name);
          if (val) vars[name] = val.trim();
        }
        const themeAttr = parentRoot.getAttribute("data-theme") || null;
        if (frame && frame.contentWindow && frame.contentWindow !== window) {
          frame.contentWindow.postMessage({ type: 'theme-sync', themeAttr: themeAttr, vars: vars }, '*');
        }
      } catch (e) {}
    } catch (e) {
      // typisk bare hvis cross-origin (skal ikke skje hos deg)
    }
  }

  // last inn siden
  frame.src = resolvedFile.href;

  // fallback hvis innhold ikke kommer opp i iframe (f.eks. X-Frame-Options/CSP)
  setTimeout(() => {
    if (_statusSent) return;
    sendStatus('timeout');
  }, 4000);

  // sync når iframe er lastet
  frame.addEventListener("load", () => {
    try {
      // Hvis iframe fortsatt er about:blank etter load er det ofte blokkert.
      const href = frame.contentWindow?.location?.href || '';
      if (href === 'about:blank') {
        sendStatus('blocked');
        return;
      }
    } catch (e) {
      // Cross-origin tilgang feil => sannsynligvis lastet ekstern side OK.
    }

    sendStatus('loaded');
    copyThemeToIframe();

    // 1) observer data-theme endringer i parent (theme switcher)
    try {
      const parentRoot = window.parent.document.documentElement;
      const mo = new MutationObserver(() => copyThemeToIframe());
      mo.observe(parentRoot, { attributes: true, attributeFilter: ["data-theme", "style", "class"] });
    } catch {}

    // 2) ekstra robust: re-sync av og til (hvis theme endres via CSS/JS uten attribute mutation)
    setInterval(copyThemeToIframe, 500);

    // 3) Send initial theme + CSS-vars to nested child (for _inview pages that embed inner iframes)
    try {
      const parentRoot = window.parent.document.documentElement;
      const parentStyle = getComputedStyle(parentRoot);
      const vars = {};
      for (let i = 0; i < parentStyle.length; i++) {
        const name = parentStyle[i];
        if (!name.startsWith("--")) continue;
        const val = parentStyle.getPropertyValue(name);
        if (val) vars[name] = val.trim();
      }
      const themeAttr = parentRoot.getAttribute("data-theme") || null;
      if (frame && frame.contentWindow && frame.contentWindow !== window) {
        frame.contentWindow.postMessage({ type: 'theme-sync', themeAttr: themeAttr, vars: vars }, '*');
      }
    } catch (e) {}
  });
</script>
</body>
</html>

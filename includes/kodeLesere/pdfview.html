<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Viewer</title>
  <script src="/FolkNettside/includes/kodeLesere/locked-view.js" defer></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b1020; color:#fff; }
    #frame { width: 100%; height: 100vh; border: 0; background: #111827; }
    .error { padding: 16px; }
    .error a { color: #93c5fd; }
  </style>
</head>
<body>
  <iframe id="frame" title="PDF document"></iframe>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const frame = document.getElementById('frame');
      if (!file) {
        document.body.innerHTML = '<div class="error">Mangler <code>?file=</code> i URL. Eksempel: <code>/includes/kodeLesere/pdfview.html?file=/docs/eksempel.pdf</code></div>';
        return;
      }
      frame.src = file;
    })();
  </script>
</body>
</html>

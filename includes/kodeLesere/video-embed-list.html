<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videooversikt</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --surface:#ffffff;
      --surface-soft:#edf3fb;
      --card:#ffffff;
      --text:#17212f;
      --muted:#61758d;
      --accent:#0b61c9;
      --accent-soft:#dbeafe;
      --accent-ink:#0f4c81;
      --border:#d7e2ee;
      --shadow:0 20px 48px rgba(15,76,129,.10);
      --hero:linear-gradient(135deg,#ffffff 0%,#eef5ff 52%,#deebff 100%);
      --chip:#edf4fb;
      --chip-text:#27537d;
      color-scheme:light;
    }
    :root[data-theme="dark"]{
      --bg:#0f141b;
      --surface:#171e28;
      --surface-soft:#1d2734;
      --card:#1a2330;
      --text:#edf3fb;
      --muted:#9cb0c6;
      --accent:#84bcff;
      --accent-soft:#1f3349;
      --accent-ink:#a7d0ff;
      --border:#2a3647;
      --shadow:0 22px 52px rgba(0,0,0,.34);
      --hero:linear-gradient(135deg,#171e28 0%,#1b2736 52%,#22354a 100%);
      --chip:#223347;
      --chip-text:#c7defc;
      color-scheme:dark;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at top right, rgba(11,97,201,.10), transparent 30%),radial-gradient(circle at top left, rgba(15,76,129,.08), transparent 22%),var(--bg);padding:1.1rem}
    .shell{max-width:1680px;margin:0 auto;display:grid;gap:.9rem}
    .hero{background:var(--hero);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:1.25rem;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;inset:auto -8% -34% auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(11,97,201,.18), rgba(11,97,201,0));pointer-events:none}
    .eyebrow{margin:0 0 .35rem;color:var(--accent);font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
    h1{margin:0;font-size:clamp(1.5rem,2.5vw,2.4rem);line-height:1.08;color:var(--accent-ink)}
    .hero-copy{max-width:980px;margin:.5rem 0 0;color:var(--muted);font-size:1rem;line-height:1.55}
    .hero-meta{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1rem}.stat-chip{border:1px solid var(--border);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:999px;padding:.45rem .8rem;font-weight:700}
    .toolbar{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr) auto;gap:.75rem;align-items:center}
    .toolbar input,.toolbar select,.toolbar button{width:100%;border:1px solid var(--border);border-radius:16px;padding:.88rem .96rem;background:var(--surface);color:var(--text);font:inherit}
    .toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(11,97,201,.12)} .toolbar button{font-weight:800;cursor:pointer}.toolbar button:hover{background:var(--surface-soft)}
    .groups{display:grid;gap:1rem}.group{border:1px solid var(--border);background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .group-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding:1rem 1rem .85rem;border-bottom:1px solid var(--border);cursor:pointer} .group-head h2{margin:0;font-size:1.12rem}.group-head p{margin:.28rem 0 0;color:var(--muted);line-height:1.4}.group-meta{text-align:right;color:var(--muted);font-weight:700;white-space:nowrap}.group.is-collapsed .group-body{display:none}.group-caret{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:999px;border:1px solid var(--border);background:var(--surface-soft);font-size:1rem;flex-shrink:0}.group.is-collapsed .group-caret{transform:rotate(-90deg)}.group-summary{margin:.55rem 0 0;color:var(--muted);font-size:.92rem;line-height:1.5}.group-summary strong{color:var(--text)}
    .group-body{display:grid;grid-template-columns:minmax(0,1.52fr) minmax(320px,.88fr);gap:.9rem;padding:.95rem}
    .stage-card,.playlist-card{border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0)),var(--card)}
    .stage-card{padding:.9rem;display:grid;gap:.85rem}.stage-wrap{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(0,0,0,.08)}.video-frame{width:100%;aspect-ratio:16/9;display:block;border:none;background:#000}
    .stage-top{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start;flex-wrap:wrap}.stage-top h3{margin:0;font-size:1.08rem;line-height:1.3}.stage-sub{margin:.32rem 0 0;color:var(--muted);line-height:1.5}
    .watch-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}.watch-toggle{display:inline-flex;align-items:center;gap:.55rem;font-weight:700;color:var(--muted)}
    .watch-state{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.28rem .68rem;background:var(--surface-soft);border:1px solid var(--border);font-weight:800}.watch-state.is-watched{color:#17603b;background:#dcfce7;border-color:#b7e7c6}:root[data-theme="dark"] .watch-state.is-watched{color:#bff7cd;background:#173625;border-color:#2a5d40}
    .themes{display:flex;flex-wrap:wrap;gap:.45rem}.theme-tag{font-size:.76rem;padding:.26rem .56rem;border-radius:999px;background:var(--chip);color:var(--chip-text);border:1px solid var(--border);font-weight:800}
    .action-row{display:flex;gap:.55rem;flex-wrap:wrap}.action-row button,.action-row a{border:1px solid var(--border);background:var(--surface-soft);color:var(--text);padding:.68rem .88rem;border-radius:14px;text-decoration:none;font-weight:800;cursor:pointer}.action-row button:hover,.action-row a:hover{background:var(--accent-soft)}
    .auth-hint{border:1px dashed var(--border);background:var(--surface-soft);color:var(--muted);padding:.8rem .9rem;border-radius:14px;line-height:1.5}
    .playlist-card{padding:.9rem;display:grid;gap:.8rem;align-content:start}.playlist-head{display:flex;justify-content:space-between;gap:.75rem;align-items:center}.playlist-head h3{margin:0;font-size:1rem}.playlist-head p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
    .playlist-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
    .item-button{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:18px;padding:.85rem;display:grid;gap:.55rem;cursor:pointer;color:var(--text)}.item-button:hover{background:var(--surface-soft);transform:translateY(-1px)}.item-button.is-active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,97,201,.12);background:linear-gradient(180deg,rgba(11,97,201,.08),rgba(11,97,201,0)),var(--card)}
    .item-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}.item-index{width:2rem;height:2rem;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent);font-weight:900;border:1px solid var(--border)}.item-title{margin:0;font-size:.98rem;line-height:1.3;word-break:break-word}.item-sub{margin:0;color:var(--muted);font-size:.87rem;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .item-badges{display:flex;flex-wrap:wrap;gap:.45rem}.mini-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .52rem;border-radius:999px;border:1px solid var(--border);background:var(--surface-soft);font-size:.76rem;font-weight:800;color:var(--muted)}.mini-badge.is-watched{color:#17603b;background:#dcfce7;border-color:#b7e7c6}:root[data-theme="dark"] .mini-badge.is-watched{color:#bff7cd;background:#173625;border-color:#2a5d40}
    .empty{border:1px dashed var(--border);background:var(--surface);padding:1rem;border-radius:18px;color:var(--muted)}
    @media (max-width:1120px){.group-body{grid-template-columns:1fr}}
    @media (max-width:820px){.toolbar{grid-template-columns:1fr}.playlist-grid{grid-template-columns:1fr 1fr}}
    @media (max-width:640px){body{padding:.7rem}.hero,.group,.stage-card,.playlist-card{border-radius:18px}.playlist-grid{grid-template-columns:1fr}.group-head,.group-body{padding:.85rem}}
  </style>
  <script src="/includes/kodeLesere/locked-view.js" defer></script>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <p class="eyebrow">Videooversikt</p>
      <h1 id="title">Videoer</h1>
      <p class="hero-copy" id="heroCopy">Se flere videoer samtidig, filtrer raskt, og f&aring; automatisk markering n&aring;r videoer faktisk er sett.</p>
      <div class="hero-meta"><span class="stat-chip" id="videoCountChip">0 videoer</span><span class="stat-chip" id="groupCountChip">0 grupper</span><span class="stat-chip" id="watchedCountChip">0 sett</span></div>
    </section>
    <section class="toolbar" aria-label="Filtrering og sortering">
      <input id="searchInput" type="search" placeholder="S&oslash;k i tittel, beskrivelse eller tema">
      <select id="sortSelect"><option value="original">Sorter: original rekkef&oslash;lge</option><option value="title">Sorter: tittel</option><option value="group">Sorter: st&oslash;rste grupper f&oslash;rst</option><option value="watched">Sorter: sett-status</option></select>
      <button id="toggleWatched" type="button">Vis: alle videoer</button>
    </section>
    <div id="groups" class="groups"></div>
  </div>
  <script>
    const TEXT = {
      missingKey: 'Mangler playlistKey.',
      noVideos: 'Fant ingen videoer i valgt mappe.',
      emptyFilter: 'Ingen videoer matcher filtreringen akkurat n\u00e5.',
      groupedInfo: 'Gruppert automatisk fra felles forelesningstittel, beskrivelse eller like navnemonstre.',
      singleInfo: 'Enkeltst\u00e5ende video i denne visningen.',
      watched: 'Sett',
      notWatched: 'Ikke sett',
      markWatched: 'Marker som sett',
      openOriginal: '\u00c5pne original',
      copyLink: 'Kopier lenke',
      copied: 'Kopiert!',
      copyFailed: 'Kunne ikke kopiere',
      watchAll: 'Vis: alle videoer',
      watchUnseen: 'Vis: bare usette videoer',
      missingPanopto: 'Hvis Panopto ikke vises: klikk \"\u00c5pne original\" og logg inn.',
      missingDrive: 'Hvis Google Drive-video ikke vises: klikk \"\u00c5pne original\" og logg inn.',
      unknownFormat: 'Ukjent videoformat: ',
      fullscreen: 'Fullskjerm',
      collapse: 'Skjul gruppe',
      expand: 'Vis gruppe',
      markGroupWatched: 'Marker gruppe som sett',
      markGroupUnwatched: 'Marker gruppe som usett'
    };

    const YT_API_SRC = 'https://www.youtube.com/iframe_api';
    const YT_WATCH_THRESHOLD = 0.72;
    const VIDEO_WATCH_THRESHOLD = 0.72;
    const watchedListeners = new Set();
    const youTubeChecks = new Map();
    const youTubeResumeTimers = new Map();
    const selectedItems = new Map();
    let hideWatched = false;
    let ytApiPromise = null;

    function applyTheme(themeAttr, vars){
      try{
        const root = document.documentElement;
        if (themeAttr) root.setAttribute('data-theme', themeAttr);
        if (vars && typeof vars === 'object'){
          Object.entries(vars).forEach(([k, v]) => {
            if (String(k).startsWith('--')) root.style.setProperty(k, String(v));
          });
        }
      }catch(e){}
    }
    function syncThemeFromParent(){
      try{
        const pRoot = window.parent && window.parent.document ? window.parent.document.documentElement : null;
        if (!pRoot) return;
        const styles = getComputedStyle(pRoot);
        applyTheme(pRoot.getAttribute('data-theme') || null, {
          '--bg': styles.getPropertyValue('--bgcolor') || styles.getPropertyValue('--bg') || '',
          '--surface': styles.getPropertyValue('--card-bg') || '',
          '--surface-soft': styles.getPropertyValue('--subtle-bg') || '',
          '--text': styles.getPropertyValue('--textcolor') || '',
          '--muted': styles.getPropertyValue('--muted') || '',
          '--accent': styles.getPropertyValue('--accent') || '',
          '--accent-ink': styles.getPropertyValue('--accent-strong') || styles.getPropertyValue('--accent') || '',
          '--border': styles.getPropertyValue('--bordercolor') || styles.getPropertyValue('--border') || ''
        });
      }catch(e){}
    }
    window.addEventListener('message', (ev) => {
      const data = ev && ev.data;
      if (!data || data.type !== 'theme-sync') return;
      applyTheme(data.themeAttr || null, data.vars || null);
    });
    syncThemeFromParent();
    setInterval(syncThemeFromParent, 1500);

    function normalizeText(value){
      return String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[\u2013\u2014]/g, '-').replace(/[_]+/g, ' ').replace(/[^a-zA-Z0-9\s-]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
    }
    function cleanLabelPart(value){
      return String(value || '').replace(/[\u2013\u2014]/g, ' - ').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').replace(/\s+\|\s+/g, ' | ').replace(/\burl\b/ig, '').trim();
    }
    function prettifyViewerTitle(value){
      const raw = cleanLabelPart(value || '');
      if (!raw) return 'Videoer';
      if (/^forelesning\.(txt|json|md|list|links|csv)$/i.test(raw) || /^forelesning$/i.test(raw)) return 'Forelesninger';
      return raw.replace(/\.(txt|json|md|list|links|csv)$/i, '');
    }
    function stripLeadingSeparators(value){ return cleanLabelPart(String(value || '').replace(/^[\s\-:|.]+/, '')); }
    function escapeRegExp(value){ return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    function stripCommonPrefix(title, base){
      const cleanTitle = cleanLabelPart(title);
      const cleanBase = cleanLabelPart(base);
      if (!cleanTitle || !cleanBase) return '';
      const direct = new RegExp('^' + escapeRegExp(cleanBase) + '(?:\\s*[\\-:|]\\s*)?', 'i');
      if (direct.test(cleanTitle)) return stripLeadingSeparators(cleanTitle.replace(direct, ''));
      return '';
    }
    function splitTitleParts(title){
      const raw = cleanLabelPart(title);
      let match = raw.match(/^(.*?)(?:\s+(del|part|episode|ep)\s*([0-9]+[a-z]?))$/i);
      if (match) return { group: cleanLabelPart(match[1]), part: `${match[2]} ${match[3]}`.trim() };
      match = raw.match(/^(.*?)(?:\s*[-:|]\s*(del|part|episode|ep)\s*([0-9]+[a-z]?))$/i);
      if (match) return { group: cleanLabelPart(match[1]), part: `${match[2]} ${match[3]}`.trim() };
      match = raw.match(/^(.*?)(?:\s*[-:|]\s*(q[0-9]+[a-z0-9-]*))$/i);
      if (match) return { group: cleanLabelPart(match[1]), part: cleanLabelPart(match[2]) };
      match = raw.match(/^(.*?)(?:\s*[-:|]\s*([A-Z]))$/);
      if (match) return { group: cleanLabelPart(match[1]), part: cleanLabelPart(match[2]) };
      return { group: raw, part: '' };
    }
    function looksNoisyLabel(value){
      const raw = cleanLabelPart(value || '');
      const norm = normalizeText(raw);
      if (!norm) return true;
      return norm.includes('webvtt') || norm.includes('align start') || norm.includes('captions language') || norm.includes('felles forelesningsnavn') || norm.includes('kort oppsummering');
    }
    function isMeaningfulDescription(value, title = '', group = ''){
      const raw = cleanLabelPart(value || '');
      const norm = normalizeText(raw);
      if (!raw || !norm) return false;
      if (looksNoisyLabel(raw)) return false;
      if (raw.length < 18) return false;
      if (norm === normalizeText(title) || norm === normalizeText(group)) return false;
      return true;
    }
    function cleanThemeList(themes){
      const seen = new Set();
      return (themes || [])
        .map(theme => cleanLabelPart(theme || ''))
        .filter(theme => {
          const norm = normalizeText(theme);
          if (!theme || !norm) return false;
          if (looksNoisyLabel(theme)) return false;
          if (/^(align|start|position|captions|language|webvtt|kind|video|ukjent|forelesning)$/i.test(theme)) return false;
          if (/^\d+$/.test(theme)) return false;
          if (norm.length < 3) return false;
          if (seen.has(norm)) return false;
          seen.add(norm);
          return true;
        });
    }
    function displayDescription(item, fallback = ''){
      if (isMeaningfulDescription(item.description, item.title, item.groupLabel)) return cleanLabelPart(item.description);
      if (isMeaningfulDescription(item.groupDescription, item.title, item.groupLabel)) return cleanLabelPart(item.groupDescription);
      return cleanLabelPart(fallback || '');
    }
    function extractLecturePrefix(value){
      const raw = cleanLabelPart(value || '');
      let match = raw.match(/^(forelesning\s*\d+)\b/i);
      if (match) return `Forelesning ${String(match[1]).replace(/[^\d]/g, '')}`;
      match = raw.match(/^(vl\s*\d+)\b/i);
      if (match) return String(match[1]).toUpperCase().replace(/\s+/g, '');
      return '';
    }
function parseStructuredLectureTitle(title){
      const raw = cleanLabelPart(title || '');
      let match = raw.match(/^(forelesning\s*\d+)\s*[-:|]\s*(.+)$/i);
      if (match){
        let rest = cleanLabelPart(match[2]);
        let part = '';
        const suffix = rest.match(/(?:\s*[-:|]\s*|\s+)([A-Z])$/);
        if (suffix){
          part = cleanLabelPart(suffix[1]);
          rest = cleanLabelPart(rest.slice(0, rest.length - suffix[0].length));
        }
        const dup = rest.match(/^(.*?)\s*[-:|]\s*(.*?)$/);
        if (dup && normalizeText(dup[1]) === normalizeText(dup[2])) rest = cleanLabelPart(dup[1]);
        return {
          group: `${extractLecturePrefix(match[1])} - ${rest}`.replace(/\s+-\s+$/, ''),
          part
        };
      }
      match = raw.match(/^(vl\s*\d+)\s+part\s*([0-9]+[a-z]?)\s*[-:|]\s*(.*)$/i);
      if (match){
        return {
          group: `${extractLecturePrefix(match[1])} - ${cleanLabelPart(match[3])}`.replace(/\s+-\s+$/, ''),
          part: `part ${match[2]}`
        };
      }
      match = raw.match(/^(vl\s*\d+)\s*[-:|]\s*(.*?)\s*[-:|]\s*(del)\s*([0-9]+[a-z]?)\s*[-:|]?\s*(.*)$/i);
      if (match){
        const detail = cleanLabelPart(match[5]);
        return {
          group: `${extractLecturePrefix(match[1])} - ${cleanLabelPart(match[2])}`.replace(/\s+-\s+$/, ''),
          part: detail ? `${match[3]} ${match[4]} - ${detail}` : `${match[3]} ${match[4]}`
        };
      }
      match = raw.match(/^(vl\s*\d+)\s*[-:|]\s*(.*?)\s*[-:|]\s*(del[0-9]+[a-z]?)\s*[-:|]?\s*(.*)$/i);
      if (match){
        const detail = cleanLabelPart(match[4]);
        return {
          group: `${extractLecturePrefix(match[1])} - ${cleanLabelPart(match[2])}`.replace(/\s+-\s+$/, ''),
          part: detail ? `${cleanLabelPart(match[3])} - ${detail}` : cleanLabelPart(match[3])
        };
      }
      match = raw.match(/^(vl\s*\d+)\s*[-:|]\s*(.*?)\s*[-:|]\s*(del|part)\s*([0-9]+[a-z]?)$/i);
      if (match){
        return {
          group: `${extractLecturePrefix(match[1])} - ${cleanLabelPart(match[2])}`.replace(/\s+-\s+$/, ''),
          part: `${match[3]} ${match[4]}`.trim()
        };
      }
      match = raw.match(/^(vl\s*\d+)\s+part\s*([0-9]+[a-z]?)$/i);
      if (match){
        return {
          group: extractLecturePrefix(match[1]),
          part: `part ${match[2]}`
        };
      }
      return null;
    }
    function inferLectureTitle(title){
      const raw = cleanLabelPart(title || '');
      const structured = parseStructuredLectureTitle(raw);
      if (structured) return structured.group;
      const prefix = extractLecturePrefix(raw);
      if (!prefix) return null;
      let rest = raw.replace(new RegExp('^' + escapeRegExp(prefix) + '\\s*[-:|]?\\s*', 'i'), '');
      rest = rest.replace(/^(del|part|episode|ep)\s*[0-9]+[a-z]?\s*[-:|]\s*/i, '');
      rest = rest.replace(/\s*[-:|]?\s*(del|part|episode|ep)\s*[0-9]+[a-z]?\s*$/i, '');
      rest = rest.replace(/\s*[-:|]?\s*([A-Z])\s*$/i, '');
      rest = rest.replace(/\s*[-:|]?\s*q[0-9]+[a-z0-9-]*\s*$/i, '');
      rest = cleanLabelPart(rest);
      if (!rest || normalizeText(rest) === normalizeText(prefix)) return prefix;
      return `${prefix} - ${rest}`;
    }
    function chooseGroupLabel(item){
      const explicitGroup = cleanLabelPart(item.group || item.group_title || '');
      const description = cleanLabelPart(item.description || '');
      const title = cleanLabelPart(item.title || 'Video');
      if (explicitGroup && !looksNoisyLabel(explicitGroup)) return explicitGroup;
      const inferred = inferLectureTitle(title);
      if (inferred) return inferred;
      if (description && normalizeText(description) !== normalizeText(title)) return description;
      return splitTitleParts(title).group || title;
    }
    function choosePartLabel(item, groupLabel){
      const explicitPart = cleanLabelPart(item.part || item.part_label || '');
      const title = cleanLabelPart(item.title || '');
      const structured = parseStructuredLectureTitle(title);
      if (structured && structured.part) return structured.part;
      if (explicitPart && !looksNoisyLabel(explicitPart)) return explicitPart;
      const fromPrefix = stripCommonPrefix(title, groupLabel);
      if (fromPrefix) return fromPrefix;
      return splitTitleParts(title).part || '';
    }
    function createSearchBlob(item){ return normalizeText([item.title, item.description, item.groupLabel, item.partLabel, item.groupDescription || '', (item.themes || []).join(' ')].join(' ')); }
    const naturalCollator = new Intl.Collator('no', { sensitivity: 'base', numeric: true });
    function extractDateParts(value){
      const text = cleanLabelPart(value);
      let match = text.match(/\b(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{2,4})\b/);
      if (match){
        let year = Number(match[3]);
        if (year < 100) year += 2000;
        return { year, month: Number(match[2]), day: Number(match[1]) };
      }
      match = text.match(/\b(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\b/);
      if (match) return { year: Number(match[1]), month: Number(match[2]), day: Number(match[3]) };
      return null;
    }
    function naturalCompare(a, b){
      const aText = cleanLabelPart(a || '');
      const bText = cleanLabelPart(b || '');
      const aDate = extractDateParts(aText);
      const bDate = extractDateParts(bText);
      if (aDate && bDate){
        const byYear = aDate.year - bDate.year;
        if (byYear) return byYear;

    if (!key){ document.body.innerHTML = `<p>${TEXT.missingKey}</p>`; throw new Error('Missing playlistKey'); }
    let payload = null;
    try{ if (window.parent && window.parent !== window && window.parent.__videoPlaylistPayloads){ payload = window.parent.__videoPlaylistPayloads[key] || null; try { delete window.parent.__videoPlaylistPayloads[key]; } catch (e) {} } }catch(e){}
    if (!payload){ try{ payload = JSON.parse(localStorage.getItem(key) || 'null'); localStorage.removeItem(key); }catch(e){} }
    if (!payload || !Array.isArray(payload.items) || !payload.items.length){ document.body.innerHTML = `<p>${TEXT.noVideos}</p>`; throw new Error('Empty playlist payload'); }
    if (payload.title) document.getElementById('title').textContent = prettifyViewerTitle(payload.title);
    const normalized = payload.items
      .map((item, index) => ({ index, title: cleanLabelPart(item.title || 'Video'), description: cleanLabelPart(item.description || ''), themes: cleanThemeList(Array.isArray(item.themes) ? item.themes.map(t => String(t || '').trim()).filter(Boolean) : []), url: item.url || '', group: cleanLabelPart(item.group || item.group_title || ''), part: cleanLabelPart(item.part || item.part_label || '') }))
      .sort(compareItems);
    const grouped = groupItems(normalized);

    function render(groups){
      currentRenderedGroups = groups;
      groupsWrap.innerHTML = '';
      if (!groups.length){ const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = TEXT.emptyFilter; groupsWrap.appendChild(empty); updateHeaderStats([], normalized); return; }
      groups.forEach((group) => groupsWrap.appendChild(buildGroupSection(group)));
      updateHeaderStats(groups, normalized);
    }
    function applyFilterAndSort(){
      const query = normalizeText(document.getElementById('searchInput').value || '');
      const sortMode = document.getElementById('sortSelect').value;
      let visibleGroups = grouped.map(group => ({ ...group, items: group.items.filter(item => { if (hideWatched && isWatched(item.url)) return false; if (!query) return true; return item.searchBlob.includes(query); }) })).filter(group => group.items.length);
      if (sortMode === 'title'){
        visibleGroups = visibleGroups.slice().sort((a, b) => naturalCompare(a.title, b.title));
        visibleGroups.forEach(group => { group.items = group.items.slice().sort(compareItems); });
      } else if (sortMode === 'watched'){
        visibleGroups = visibleGroups.slice().sort((a, b) => a.items.filter(item => isWatched(item.url)).length - b.items.filter(item => isWatched(item.url)).length || a.index - b.index);
      } else if (sortMode === 'group'){
        visibleGroups = visibleGroups.slice().sort((a, b) => b.items.length - a.items.length || naturalCompare(a.title, b.title));
      } else {
        visibleGroups = visibleGroups.slice().sort((a, b) => a.index - b.index);
      }
      render(visibleGroups);
    }
    watchedListeners.add(() => { document.querySelectorAll('.group').forEach((section, idx) => { const group = currentRenderedGroups[idx]; if (group) updateGroupMeta(section, group); }); updateHeaderStats(currentRenderedGroups, normalized); });
    document.getElementById('searchInput').addEventListener('input', applyFilterAndSort);
    document.getElementById('sortSelect').addEventListener('change', applyFilterAndSort);
    document.getElementById('toggleWatched').addEventListener('click', () => { hideWatched = !hideWatched; updateToggleLabel(); applyFilterAndSort(); });
    updateToggleLabel();
    applyFilterAndSort();
  </script>
</body>
</html>
